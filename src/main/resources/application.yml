eureka:
  server:
    enable-self-preservation: ${ENABLE_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: ${EVICTION_INTERVAL_TIMER:1000}
  instance:
    hostname: ${HOST_NAME:localhost}
    prefer-ip-address: ${PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}
  client:
    register-with-eureka: ${REGISTER_WITH_EUREKA:false}
    fetch-registry: ${FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${DEFAULT_ZONE:http://${eureka.instance.hostname}:${server.port}/eureka/}

logging:
  level:
    ROOT: info
    org.springframework: info
    org.bremersee: info
    com.netflix.eureka.registry: warn
    com.netflix.discovery.shared.resolver: warn
    org.springframework.cloud.configclient: warn

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-headers: "*"
        allowed-methods: "*"
        allowed-origins: "*"
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8761}
  servlet:
    context-path: ${CONTEXT_PATH:/}
  tomcat:
    accesslog:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: in-memory

bremersee:
  authentication:
    in-memory:
      enabled: true
      users:
        - name: ${EUREKA_USER_NAME:eureka}
          password: ${EUREKA_USER_PASSWORD:changeit}
          authorities:
            - ROLE_EUREKA_SERVER_ADMIN
        - name: ${ACTUATOR_USER_NAME:actuator}
          password: ${ACTUATOR_USER_PASSWORD:changeit}
          authorities:
            - ROLE_ACTUATOR
        - name: ${ADMIN_NAME:admin}
          password: ${ADMIN_PASSWORD:changeit}
          authorities:
            - ROLE_EUREKA_SERVER_ADMIN
            - ROLE_ACTUATOR_ADMIN

---

spring:
  config:
    activate:
      on-profile: simple-ldap

bremersee:
  ldaptive:
    ldap-url: ldaps://dc1.eixe.bremersee.org ldaps://dc2.eixe.bremersee.org
    ldaptive-template-class: org.bremersee.ldaptive.LdaptiveSambaTemplate
    immutable: true
    use-start-tls: false
    pooled: false
  authentication:
    ldaptive:
      template: active_directory
      user-base-dn: cn=users,dc=eixe,dc=bremersee,dc=org
      user-find-one-search-scope: subtree
      refused-usernames:
        - "Administrator"
      role-prefix: "ROLE_"
      role-case-transformation: to_upper_case
      role-string-replacements:
        - regex: "[- ]"
          replacement: "_"
        - regex: "_ADMINS"
          replacement: "_ADMIN"
      role-mapping:
        - source: "Domain Admins"
          target: "ROLE_ADMIN"
        - source: "samba-admins"
          target: "ROLE_ADMIN"
